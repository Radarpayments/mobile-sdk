			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Stop the build when Gradle fails, or Xcode embeds the previous framework.\nset -e\nexport JAVA_HOME=\"$HOME/.sdkman/candidates/java/21.0.2-tem\"\nREPO=\"$SRCROOT/../..\"\nXCF=\"$REPO/sdk-payment-scanner/build/XCFrameworks/debug/sdk_payment_scanner.xcframework\"\n\n# The app links only sdk_payment_scanner (it exports sdk-payment).\n# Link just the architecture being built: the full XCFramework compiles and links three of them (~4 min).\ncase \"$PLATFORM_NAME:$ARCHS\" in\n  iphonesimulator:arm64) TARGET=iosSimulatorArm64; SLICE=ios-arm64_x86_64-simulator ;;\n  iphonesimulator:x86_64) TARGET=iosX64; SLICE=ios-arm64_x86_64-simulator ;;\n  iphoneos:arm64) TARGET=iosArm64; SLICE=ios-arm64 ;;\n  *) TARGET=\"\"; case \"$PLATFORM_NAME\" in iphonesimulator) SLICE=ios-arm64_x86_64-simulator ;; *) SLICE=ios-arm64 ;; esac ;;\nesac\nif [ -n \"$TARGET\" ] && [ -d \"$XCF/$SLICE\" ]; then\n  LINK_TASK=\":sdk-payment-scanner:linkDebugFramework$(echo \"$TARGET\" | cut -c1 | tr a-z A-Z)$(echo \"$TARGET\" | cut -c2-)\"\n  \"$REPO/gradlew\" -p \"$REPO\" $LINK_TASK\n  FRESH=\"$REPO/sdk-payment-scanner/build/bin/$TARGET/debugFramework/sdk_payment_scanner.framework\"\n  # Keep the XCFramework slice current too, so Xcode's own copy of it is never stale.\n  rsync -a --delete \"$FRESH/\" \"$XCF/$SLICE/sdk_payment_scanner.framework/\"\nelse\n  # First build (no XCFramework yet) or several architectures at once.\n  \"$REPO/gradlew\" -p \"$REPO\" :sdk-payment-scanner:assembleSdk_payment_scannerDebugXCFramework\n  FRESH=\"$XCF/$SLICE/sdk_payment_scanner.framework\"\nfi\n\n# Xcode copies the XCFramework slice into BUILT_PRODUCTS_DIR before this phase runs, and its embed step\n# does not notice the framework changing afterwards: the app would link and run the previous build.\n# Put the fresh framework in both places (the embedded copy without headers, signed like the embed step does).\nrsync -a --delete \"$FRESH/\" \"$BUILT_PRODUCTS_DIR/sdk_payment_scanner.framework/\"\nEMBEDDED=\"$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/sdk_payment_scanner.framework\"\nif [ -d \"$EMBEDDED\" ]; then\n  rsync -a --delete --exclude Headers --exclude Modules \"$FRESH/\" \"$EMBEDDED/\"\n  codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$EMBEDDED\"\nfi\n";
			showEnvVarsInLog = 0;
		};
