[versions]
androidsvg = "1.4"
# Kotlin follows Compose Multiplatform: the 1.10 libraries are built with Kotlin 2.2.20, and an older compiler cannot
# read them. An app compiling against the SDK then needs Kotlin 2.1+ (2.0 fails with "incompatible version of Kotlin").
kotlin = "2.2.21"
agp = "8.7.2"
# The integrator's minimums follow this version. Not 1.11: built with Kotlin 2.3, so apps would need Kotlin 2.2+, and no
# iosX64 builds. Not 1.12: its Android libraries need compileSdk 37 and AGP 9.1 in every app using the SDK.
compose-mp = "1.10.3"
# Material is versioned apart from Compose Multiplatform since 1.10; these are the versions its plugin pairs with 1.10.3.
compose-mp-material3 = "1.9.0"
compose-mp-material-icons = "1.7.3"
androidx-activity-compose = "1.9.3"
androidx-navigation-compose = "2.8.3"
androidx-webkit = "1.12.1"
androidx-compose-ui-test = "1.11.0"
play-services-wallet = "19.4.0"
play-services-tasks-coroutines = "1.9.0"
okhttp = "4.12.0"
coroutines = "1.9.0"
kotlinx-datetime = "0.7.1"
kotlinx-serialization = "1.7.3"
ktor = "3.0.1"
kotest = "5.9.1"
turbine = "1.2.0"
junit5 = "5.11.3"
ktlint = "12.1.1"
detekt = "1.23.7"
bcv = "0.16.3"
kover = "0.9.11"
skie = "0.10.15"
android-compile-sdk = "35"
android-min-sdk = "24"
jvm-target = "17"
androidx-core-ktx = "1.13.1"
androidx-lifecycle = "2.8.7"
androidx-compose-bom = "2026.04.01"
androidx-compose-material3 = "1.4.0"
# 1.3's libimage_processing_util_jni.so was aligned to 4 KB pages: Android 15+ on 16 KB-page devices warned the app
# "isn't 16 KB compatible" and Google Play rejects such apps. 1.4 aligns it to 16 KB. Not 1.6: compileSdk 36, AGP 8.9.1.
androidx-camerax = "1.4.2"
androidx-startup = "1.2.0"
androidx-datastore-preferences = "1.1.1"
androidx-test-ext-junit = "1.2.1"
# Espresso before 3.6.1 calls InputManager.getInstance, gone on recent Android: every Compose UI test failed there.
androidx-test-espresso = "3.7.0"
androidx-test = "1.7.0"
compose-icons = "1.1.1"
mlkit-text-recognition = "16.0.1"

[libraries]
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvg" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
junit5-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit5-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4-android", version.ref = "androidx-compose-ui-test" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui-test" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore-preferences" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }

compose-icons-tabler = { module = "br.com.devsrsouza.compose.icons:tabler-icons", version.ref = "compose-icons" }

compose-mp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-mp" }
compose-mp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-mp" }
compose-mp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-mp" }
compose-mp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-mp-material3" }
compose-mp-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-mp-material-icons" }

