name: payrdr_sdk
description: "payrdr payment SDK for Flutter: the native payment sheet with 3-D Secure, Google Pay, Apple Pay and the card scanner, and SDK Core card encryption."
version: 1.0.0-beta.2
publish_to: none

environment:
  sdk: ^3.6.0
  # Color.toARGB32 and Swift Package Manager support.
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: net.payrdr.mobile.payment.flutter
        pluginClass: PayrdrSdkPlugin
      ios:
        pluginClass: PayrdrSdkPlugin
