ext.PayrdrSdk = [
  minSdkVersion: 24,
  compileSdkVersion: 36
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return PayrdrSdk[prop]
}

// The SDK's Android libraries. In this repository they are built into build/maven by scripts/build-bridge.sh (the
// module is linked from node_modules, hence the canonical path); an app that takes the module from elsewhere points
// payrdrMavenUrl (gradle.properties) at the repository that serves them.
def payrdrMavenUrl = project.findProperty("payrdrMavenUrl") ?: new File(projectDir.canonicalFile, "../../../build/maven").toURI().toString()
def payrdrSdkVersion = project.findProperty("payrdrSdkVersion") ?: "4.0.0-beta.4"

// The app resolves the SDK as well (the module's dependency is part of its build), so it needs the repository too.
rootProject.allprojects {
  repositories {
    maven { url payrdrMavenUrl }
  }
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "net.payrdr.mobile.payment.reactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "io.github.radarpayments:sdk-bridge-android:${payrdrSdkVersion}"
}
