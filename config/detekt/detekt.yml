build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
  CyclomaticComplexMethod:
    active: true
    threshold: 20

style:
  MagicNumber:
    active: false
  UnusedPrivateMember:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 140
  ReturnCount:
    active: true
    max: 4
  WildcardImport:
    active: true

naming:
  FunctionNaming:
    active: true
    functionPattern: '([a-z][a-zA-Z0-9]*)|(`.*`)'
    # Composables are named like types.
    ignoreAnnotated: ['Composable']

comments:
  UndocumentedPublicClass:
    active: true
    # Samples are apps, with no API of their own to document.
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**', '**/samples/**']
  UndocumentedPublicFunction:
    active: true
    # Samples are apps, with no API of their own to document.
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**', '**/samples/**']
  UndocumentedPublicProperty:
    active: false
