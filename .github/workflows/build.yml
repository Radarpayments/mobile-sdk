name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
      - name: ktlint + detekt + versions
        run: ./gradlew ktlintCheck detekt verifyVersions --no-daemon --stacktrace
      - name: Assemble Android
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Android unit tests
        run: ./gradlew testDebugUnitTest testReleaseUnitTest --no-daemon --stacktrace
      - name: Binary-compat validator
        run: ./gradlew apiCheck --no-daemon --stacktrace

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
      - name: Link iOS frameworks
        run: ./gradlew linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace
      - name: iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test --no-daemon --stacktrace
